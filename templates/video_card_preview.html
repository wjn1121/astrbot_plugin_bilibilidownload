<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=760">
<title>video_card.html 静态预览（示例数据）</title>
<!--
  这是 templates/video_card.html 的**静态预览版**：把 Jinja2 变量替换为示例数据，
  纯离线自包含（封面/头像用占位块），双击用浏览器打开即可看真实布局与配色。

  ⚠️ 真正用于渲染的是 templates/video_card.html（保留 {% %} / {{ }} 占位符），
     本文件只作视觉效果核对，不要拿去 html_render。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* 预览页背景压暗一点，方便看清卡片本身的边界（真实渲染是纯白卡片） */
  html { background: #EDEFF2; }

  body {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    background: #ffffff;
    color: #18191C;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC",
                 "Source Han Sans SC", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card { padding: 22px 22px 24px; }

  .header { display: flex; align-items: center; gap: 14px; }

  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    object-fit: cover; background: #E3E5E7; flex: 0 0 auto;
  }

  .meta { flex: 1 1 auto; min-width: 0; }

  .nickname {
    font-size: 26px; line-height: 1.25; color: #18191C;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .time { font-size: 20px; line-height: 1.3; color: #9499A0; margin-top: 5px; }

  .brand { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; }
  .brand-text { font-size: 25px; line-height: 1; color: #00AEEC; font-weight: 500; }

  .title {
    margin-top: 18px;
    font-size: 30px; font-weight: 600; line-height: 1.45;
    color: #18191C;
    word-break: break-word;
  }

  .cover-wrap { margin-top: 16px; }

  .cover {
    display: block; width: 100%;
    aspect-ratio: 16 / 9; object-fit: cover;
    border-radius: 10px; background: #E3E5E7;
  }

  .cover-placeholder {
    display: flex; align-items: center; justify-content: center;
    color: #9499A0; font-size: 22px;
    background: linear-gradient(135deg, #EDEFF2, #DCE0E5);
  }

  .summary {
    margin-top: 16px;
    padding: 16px 18px;
    background: #F6F7F8;
    border-radius: 10px;
    font-size: 24px; line-height: 1.62; color: #18191C;
    word-break: break-word;
  }

  .summary-basis {
    margin-top: 10px;
    font-size: 19px; line-height: 1.4; color: #9499A0;
  }
</style>
</head>
<body>
  <div class="card">

    <div class="header">
      <!-- owner_face 为空时，模板渲染的就是这个灰底圆形占位 -->
      <div class="avatar"></div>

      <div class="meta">
        <div class="nickname">路人甲导演</div>
        <div class="time">2026-09-26 09:39:44</div>
      </div>

      <div class="brand">
        <svg width="31" height="22" viewBox="0 0 34 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 2.5 L12.5 7" stroke="#00AEEC" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M26 2.5 L21.5 7" stroke="#00AEEC" stroke-width="2.4" stroke-linecap="round"/>
          <rect x="2" y="6.5" width="30" height="16" rx="4.5" stroke="#00AEEC" stroke-width="2.4"/>
          <circle cx="12" cy="14.5" r="2.1" fill="#00AEEC"/>
          <circle cx="22" cy="14.5" r="2.1" fill="#00AEEC"/>
        </svg>
        <span class="brand-text">bilibili</span>
      </div>
    </div>

    <div class="title">学术回战！拼尽全力仍无法战胜？！【小明修仙传EP10】【AI月月抢位赛】</div>

    <div class="cover-wrap">
      <div class="cover cover-placeholder">视频封面 16:9（渲染时内嵌真实封面）</div>
    </div>

    <div class="summary">
      <div>AI总结：小明在秘境中与神秘势力对抗，利用基础连线题、体术和储物书包救出铁柱，借助拼音奥义与不灭黑焰破解危机，最终以差字第五音CHA重生，揭露自身为被炼废的三好缺德丹，成功稳定秘境并突破境界，展现智慧与机变并存的修仙历程。</div>
      <div class="summary-basis">（基于简介与热评）</div>
    </div>

    <!-- 热评已改为独立图片，见 replies_card.html / replies_card_preview.html -->
  </div>
</body>
</html>
